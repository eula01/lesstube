<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="The YouTube videos that LessWrong keeps telling each other to watch.">
<link rel="canonical" href="https://lesstube.vercel.app/">
<meta property="og:site_name" content="LessTube">
<meta property="og:type" content="website">

<meta property="og:description" content="The YouTube videos that LessWrong keeps telling each other to watch.">
<meta property="og:url" content="https://lesstube.vercel.app/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="About - LessTube">
<meta name="twitter:description" content="The YouTube videos that LessWrong keeps telling each other to watch.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235d8a73'/%3E%3Ctext x='16' y='23.5' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-weight='700' font-size='22' fill='white'%3EL%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #ffffff; --bg2: #f2f2f2; --bg3: #e5e5e5; --text: #0f0f0f; --muted: #606060;
    --line: #e5e5e5; --accent: #78a68d; --chip: #f2f2f2; --chip-on: #0f0f0f; --chip-on-text: #ffffff;
    --hover: rgba(0,0,0,.05); --good: #065fd4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f0f0f; --bg2: #272727; --bg3: #3f3f3f; --text: #f1f1f1; --muted: #aaaaaa;
      --line: #303030; --chip: #272727; --chip-on: #f1f1f1; --chip-on-text: #0f0f0f;
      --hover: rgba(255,255,255,.08); --good: #3ea6ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f0f0f; --bg2: #272727; --bg3: #3f3f3f; --text: #f1f1f1; --muted: #aaaaaa;
    --line: #303030; --chip: #272727; --chip-on: #f1f1f1; --chip-on-text: #0f0f0f;
    --hover: rgba(255,255,255,.08); --good: #3ea6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.4 Roboto, "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { width: 24px; height: 24px; fill: currentColor; flex: none; }

  /* top bar */
  .top { position: fixed; inset: 0 0 auto 0; height: 56px; z-index: 10; background: var(--bg);
         display: flex; align-items: center; justify-content: space-between; padding: 0 16px; gap: 16px; }
  .left { display: flex; align-items: center; gap: 12px; flex: none; }
  .icon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
  .icon:hover { background: var(--hover); }
  .brand { display: flex; align-items: center; font-weight: 700; font-size: 20px; letter-spacing: -.8px; white-space: nowrap; }
  .brand .word b { color: var(--accent); font-weight: 700; }
  .search { flex: 0 1 640px; display: flex; min-width: 0; }
  .search input { flex: 1; min-width: 0; height: 40px; padding: 0 16px; font: inherit; font-size: 16px;
                  color: var(--text); background: var(--bg); border: 1px solid var(--bg3); border-right: 0;
                  border-radius: 40px 0 0 40px; outline: none; }
  .search input:focus { border-color: var(--good); }
  .search button { width: 64px; height: 40px; border: 1px solid var(--bg3); background: var(--bg2);
                   border-radius: 0 40px 40px 0; display: grid; place-items: center; }
  .right { display: flex; align-items: center; }

  /* sidebar */
  .side { position: fixed; top: 56px; bottom: 0; left: 0; width: 240px; overflow-y: auto; padding: 12px;
          background: var(--bg); z-index: 9; }
  .side a { display: flex; align-items: center; gap: 24px; height: 40px; padding: 0 12px; border-radius: 10px; }
  .side a:hover { background: var(--hover); }
  .side a.on { background: var(--bg2); font-weight: 500; }
  .side .area { gap: 14px; }
  .side .area span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.collapsed .side { width: 72px; padding: 4px; }
  body.collapsed .side a { flex-direction: column; gap: 4px; height: 74px; justify-content: center; font-size: 10px; padding: 0; }
  .scrim { display: none; }

  main { margin-left: 240px; padding: 56px 24px 40px; }
  body.collapsed main { margin-left: 72px; }

  /* chips */
  .chip { flex: none; height: 32px; padding: 0 12px; border-radius: 8px; background: var(--chip);
          font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; }
  .chip:hover { background: var(--bg3); }
  .chip.on { background: var(--chip-on); color: var(--chip-on-text); }

  /* video grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 40px 16px; padding-top: 12px; }
  .vcard { display: block; min-width: 0; }
  .thumb { position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: var(--bg2); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: border-radius .15s; }
  .later-btn { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 4px;
               background: rgba(0,0,0,.8); color: #fff; display: none; place-items: center; cursor: pointer; }
  .later-btn svg { width: 20px; height: 20px; }
  a:hover .later-btn, .later-btn:focus, .later-btn.on { display: grid; }
  .dur { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.8); color: #fff; font-size: 12px;
         font-weight: 500; padding: 1px 4px; border-radius: 4px; }
  .info { display: flex; gap: 12px; padding-top: 12px; }
  .vt { margin: 0 0 4px; font-size: 16px; font-weight: 500; line-height: 22px;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sub { color: var(--muted); font-size: 14px; line-height: 20px; }
  .sentinel { height: 1px; }
  .status { color: var(--muted); padding: 24px 0; text-align: center; }

  /* search results (list layout) */
  .results { display: flex; flex-direction: column; gap: 16px; padding-top: 16px; max-width: 1100px; }
  .srow { display: flex; gap: 16px; }
  .srow .thumb { width: 360px; flex: none; }
  .srow .vt { font-size: 18px; line-height: 26px; font-weight: 400; }
  .srow .chan { display: flex; align-items: center; gap: 8px; margin: 12px 0; color: var(--muted); }
  .snip { color: var(--muted); font-size: 12px; line-height: 18px;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .via { display: inline-block; margin-top: 8px; font-size: 12px; color: var(--muted); background: var(--bg2);
         padding: 2px 6px; border-radius: 4px; }
  .note { color: var(--muted); padding: 16px 0 0; }
  .filterbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 16px; max-width: 1100px; }
  .catwrap { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; }
  .catwrap .chip { display: inline-flex; align-items: center; text-decoration: none; }
  .pagehead .crumb { display: inline-block; margin-top: 16px; color: var(--muted); font-size: 14px; }
  .pagehead .crumb + h2 { margin-top: 2px; }
  .explore { max-width: 1400px; }
  .explore .quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 4px; }
  .explore .quick .pill { color: var(--text); text-decoration: none; }
  .explore .quick + .areas { margin-top: 16px; }
  .sechead { font-size: 20px; font-weight: 700; margin: 28px 0 2px; }
  .sechead + .sub { margin: 0 0 14px; }
  .areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .areacard { background: var(--bg2); border-radius: 12px; padding: 14px 16px; }
  .areaname { display: flex; align-items: center; font-weight: 600; font-size: 16px; margin-bottom: 6px; }
  .areacard .count { margin-left: auto; padding-left: 8px; color: var(--muted); font-size: 12px; font-weight: 400; }
  .cats a { display: flex; align-items: center; padding: 4px 0; color: var(--muted); font-size: 14px; }
  .cats a:hover, .areaname:hover { color: var(--text); text-decoration: underline; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px 16px; }
  .mosaic { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; aspect-ratio: 16 / 9;
            border-radius: 12px; overflow: hidden; background: var(--bg2); }
  .mosaic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .plcount { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.8); color: #fff; font-size: 12px;
             font-weight: 500; padding: 2px 6px; border-radius: 4px; }
  .plcard .vt { margin: 10px 0 4px; }
  .plpage { max-width: 1100px; }
  .plhead { display: flex; gap: 24px; padding-top: 24px; align-items: flex-start; }
  .plhead .mosaic { width: 360px; flex: none; }
  .plinfo { min-width: 0; }
  .plinfo .crumb { color: var(--muted); font-size: 14px; }
  .plinfo h2 { font-size: 28px; line-height: 34px; margin: 4px 0 6px; }
  .plinfo .intro { line-height: 22px; margin: 12px 0; }
  .plinfo .filterbar { padding-top: 0; }
  .plrows { list-style: none; padding: 0; margin: 24px 0 0; display: flex; flex-direction: column; gap: 16px; }
  .plrows li { display: flex; gap: 12px; align-items: flex-start; }
  .plrows .num { width: 24px; flex: none; text-align: right; color: var(--muted); padding-top: 4px; }
  .plrows .srow { flex: 1; min-width: 0; }
  .plrows .srow .thumb { width: 280px; }
  .plnote { margin: 8px 0 0; color: var(--text); font-size: 14px; line-height: 20px; }
  .filterbar .grow { flex: 1; }
  .playall { color: var(--text); text-decoration: none; }   /* the chip bar already has bottom padding */
  .filterbar .chip { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
  .filterbar .chip span { font-size: 16px; line-height: 1; opacity: .7; }
  .pill.on { background: var(--bg3); }
  .filters { display: flex; gap: 16px 40px; flex-wrap: wrap; padding: 16px 0 8px; max-width: 1100px;
             border-bottom: 1px solid var(--bg3); }
  .filters[hidden] { display: none; }
  .filters h4 { margin: 0 0 8px; padding-bottom: 10px; border-bottom: 1px solid var(--bg3); font-size: 12px;
                font-weight: 500; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); min-width: 140px; }
  .filters a { display: block; padding: 7px 0; color: var(--muted); text-decoration: none; }
  .filters a:hover, .filters a.on { color: var(--text); }
  .filters a.on { font-weight: 500; }

  /* watch page */
  .watch { display: flex; gap: 24px; padding-top: 24px; max-width: 1754px; margin: 0 auto; }
  .primary { flex: 1; min-width: 0; }
  .secondary { width: 402px; flex: none; }
  .player { aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #000; }
  .player iframe { width: 100%; height: 100%; border: 0; display: block; }
  .watch h1 { font-size: 20px; line-height: 28px; font-weight: 700; margin: 12px 0 8px; }
  .owner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .owner .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .owner .who b { font-size: 16px; font-weight: 500; display: block; }
  .actions { display: flex; gap: 8px; }
  .pill { height: 36px; padding: 0 16px; border-radius: 18px; background: var(--bg2); font-weight: 500;
          display: inline-flex; align-items: center; gap: 6px; }
  .pill:hover { background: var(--bg3); }
  .pill svg { width: 20px; height: 20px; }
  .seg { display: flex; border-radius: 18px; overflow: hidden; background: var(--bg2); }
  .seg button { height: 36px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
  .seg button:hover { background: var(--bg3); }
  .seg button + button { border-left: 1px solid var(--bg3); }
  .seg button.on svg { color: var(--good); }
  .desc { background: var(--bg2); border-radius: 12px; padding: 12px; margin-top: 12px; }
  .desc .top-line { font-weight: 500; margin-bottom: 6px; }
  .desc p { margin: 0 0 10px; }
  .desc .why { color: var(--muted); }
  .desc .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--bg3); }
  .tag.cat { font-weight: 500; }
  .comments h2 { font-size: 20px; margin: 24px 0 16px; }
  .cmt { display: flex; gap: 16px; margin-bottom: 20px; }
  .cmt .meta { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .cmt .meta b { color: var(--text); font-weight: 500; margin-right: 4px; }
  .cmt .body { word-wrap: break-word; overflow-wrap: anywhere; }
  .cmt .body p { margin: 0 0 6px; }
  .cmt .foot { display: flex; gap: 12px; font-size: 12px; color: var(--muted); align-items: center; }
  .cmt .foot a:hover { color: var(--text); }
  .stance { color: var(--muted); }
  .stance.strong_rec { color: var(--text); font-weight: 500; }
  .mk { color: var(--muted); white-space: nowrap; }
  .mk.v { color: var(--text); font-weight: 500; }
  .more { color: var(--muted); font-weight: 500; font-size: 13px; }
  .next { display: flex; gap: 8px; margin-bottom: 8px; }
  .next .thumb { width: 168px; flex: none; border-radius: 8px; }
  .next .vt { font-size: 14px; line-height: 20px; }
  .next .sub { font-size: 12px; line-height: 18px; }

  /* area page header */
  .pagehead h2 { font-size: 24px; margin: 16px 0 0; }
  .pagehead .sub { margin: 4px 0 0; }
  /* keyboard selection, shortcuts overlay, toast */
  .vcard, .srow, .next { scroll-margin: 128px 0 24px; border-radius: 12px; }
  .kbd { outline: 2px solid var(--good); outline-offset: 4px; }
  .help { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.5); place-items: center; padding: 16px; }
  .help.on { display: grid; }
  .help-card { background: var(--bg); color: var(--text); border-radius: 12px; padding: 20px 24px; max-width: 420px; width: 100%;
               box-shadow: 0 8px 32px rgba(0,0,0,.3); }
  .help-card h3 { margin: 0 0 12px; font-size: 18px; }
  .help-card table { border-collapse: collapse; width: 100%; }
  .help-card td { padding: 5px 0; vertical-align: top; }
  .help-card td:first-child { width: 100px; white-space: nowrap; }
  kbd { font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 3px 6px; border-radius: 4px;
        background: var(--bg2); border: 1px solid var(--bg3); }
  .toast { position: fixed; left: 24px; bottom: 24px; z-index: 21; background: #222; color: #fff; padding: 10px 16px;
           border-radius: 8px; font-size: 14px; opacity: 0; transform: translateY(8px); transition: opacity .15s, transform .15s;
           pointer-events: none; }
  .toast.on { opacity: 1; transform: none; }
  .settings { max-width: 720px; }
  .setting { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-top: 24px;
             padding: 16px; border-radius: 12px; background: var(--bg2); cursor: pointer; }
  .setting b { font-weight: 500; font-size: 15px; }
  .setting p { margin: 6px 0 0; color: var(--muted); line-height: 1.5; }
  .switch { position: relative; flex: none; width: 36px; height: 20px; margin-top: 2px; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch .knob { position: absolute; inset: 0; border-radius: 10px; background: var(--bg3); transition: background .15s; pointer-events: none; }
  .switch .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
                         background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
  .switch input:checked + .knob { background: var(--good); }
  .switch input:checked + .knob::after { transform: translateX(16px); }
  .switch input:focus-visible + .knob { outline: 2px solid var(--good); outline-offset: 2px; }
  .poster { position: relative; width: 100%; height: 100%; padding: 0; display: block; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .poster .play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 68px; height: 48px;
                  border-radius: 14px; background: rgba(0,0,0,.7); display: grid; place-items: center; transition: background .15s; }
  .poster:hover .play { background: var(--accent); }
  .poster .play svg { width: 32px; height: 32px; color: #fff; }
  .about { max-width: 720px; margin: 0 auto; padding: 24px 0 48px; font-size: 15px; line-height: 1.6; }
  .about h1 { font-size: 32px; line-height: 1.2; margin: 8px 0 8px; letter-spacing: -.5px; }
  .about .lede { font-size: 18px; color: var(--muted); margin: 0 0 24px; }
  .about h2 { font-size: 20px; margin: 32px 0 8px; }
  .about p { margin: 0 0 12px; }
  .about ul { margin: 0 0 12px; padding-left: 20px; }
  .about li { margin-bottom: 6px; }
  .about a { color: var(--good); }
  .about a:hover { text-decoration: underline; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 8px 0 8px; }
  .stat { background: var(--bg2); border-radius: 12px; padding: 14px 16px; }
  .stat b { display: block; font-size: 24px; font-weight: 700; letter-spacing: -.5px; }
  .stat span { color: var(--muted); font-size: 13px; }
  .steps { counter-reset: s; list-style: none; padding: 0 !important; }
  .steps li { counter-increment: s; position: relative; padding-left: 36px; margin-bottom: 12px; }
  .steps li::before { content: counter(s); position: absolute; left: 0; top: 1px; width: 24px; height: 24px;
                      border-radius: 50%; background: var(--accent); color: #fff; font-size: 13px; font-weight: 700;
                      display: grid; place-items: center; }
  .fine { color: var(--muted); font-size: 13px; }
  .about code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg2); padding: 1px 5px; border-radius: 4px; }
  .about .pill.dl { color: var(--text); text-decoration: none; }
  .files { width: 100%; border-collapse: collapse; font-size: 14px; }
  .files td { padding: 8px 8px 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
  .files td.num { white-space: nowrap; color: var(--muted); }
  .files td:first-child { white-space: nowrap; }
  .prompt { font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg2); border-radius: 12px;
            padding: 14px 16px; white-space: pre-wrap; margin: 12px 0 8px; }

  @media (max-width: 1100px) {
    .watch { flex-direction: column; }
    .secondary { width: 100%; }
  }
  @media (max-width: 800px) {
    main, body.collapsed main { margin-left: 0; padding: 56px 16px 32px; }
    .side { transform: translateX(-100%); transition: transform .2s; width: 240px; box-shadow: 0 0 24px rgba(0,0,0,.3); }
    body.drawer .side { transform: none; }
    body.collapsed .side { width: 240px; padding: 12px; }
    body.collapsed .side a { flex-direction: row; height: 40px; font-size: 14px; padding: 0 12px; justify-content: flex-start; gap: 24px; }
    body.drawer .scrim { display: block; position: fixed; inset: 56px 0 0 0; background: rgba(0,0,0,.4); z-index: 8; }
    .brand { font-size: 17px; letter-spacing: -.6px; }
    .search input { padding: 0 12px; }
    .search button { width: 44px; }
    .icon { width: 34px; }
    .srow { flex-direction: column; gap: 8px; }
    .srow .thumb { width: 100%; }
    .plhead { flex-direction: column; gap: 16px; padding-top: 16px; }
    .plhead .mosaic { width: 100%; }
    .plrows .srow .thumb { width: 100%; }
    .plrows .num { display: none; }
    .grid { grid-template-columns: 1fr; gap: 24px; }
    .watch { padding-top: 0; margin: 0 -16px; }
    .player { border-radius: 0; }
    .primary > :not(.player):not(.desc), .secondary { padding-left: 16px; padding-right: 16px; }
    .desc { margin: 12px 16px 0; }
    .top { gap: 8px; padding: 0 8px 0 4px; }
    .left { gap: 4px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="left">
    <button class="icon" id="menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
    <a class="brand" href="/" aria-label="LessTube home"><span class="word">Less<b>Tube</b></span></a>
  </div>
  <form class="search" id="search" role="search">
    <input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search">
    <button aria-label="Search"><svg viewBox="0 0 24 24"><path d="M20.87 20.17l-5.59-5.59A6.95 6.95 0 0 0 17 10a7 7 0 1 0-7 7c1.75 0 3.35-.64 4.58-1.71l5.59 5.59.7-.71zM10 16a6 6 0 1 1 0-12 6 6 0 0 1 0 12z"/></svg></button>
  </form>

<main id="view"></main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const view = $("#view");
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem("lesstube:" + k)); return v ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("lesstube:" + k, JSON.stringify(v)); } catch {} },
};
let likes = store.get("likes", []), dislikes = store.get("dislikes", []);
let seen = store.get("seen", []);           // videos opened, newest last; kept out of the Home feed
// a fresh seed on every page load: reloading rerolls Home, while scrolling and going back from a video keep it
const seed = String(Math.floor(Math.random() * 1e9));
let watchLater = store.get("later", []);   // saved for later, newest last
const CLOCK = '<svg viewBox="0 0 24 24"><path d="M14.97 16.95 10 13.87V7h2v5.76l4.03 2.49-1.06 1.7zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>';
const CHECK = '<svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
function toggleLater(vid) {
  watchLater = watchLater.includes(vid) ? watchLater.filter(v => v !== vid) : watchLater.concat(vid);
  store.set("later", watchLater);
  return watchLater.includes(vid);
}
function markSeen(vid) {
  seen = seen.filter(v => v !== vid).concat(vid).slice(-200);
  store.set("seen", seen);
}

// ---------- formatting ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dur = (s) => { if (!s) return ""; const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}` : `${m}:${String(x).padStart(2,"0")}`; };
const views = (n) => n == null ? "" : n >= 1e9 ? `${(n/1e9).toFixed(1).replace(/\.0$/,"")}B views`
  : n >= 1e6 ? `${(n/1e6).toFixed(1).replace(/\.0$/,"")}M views` : n >= 1e3 ? `${Math.round(n/1e3)}K views` : `${n} views`;
function ago(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso)) / 1000, units = [["year", 31536000], ["month", 2592000], ["week", 604800], ["day", 86400]];
  for (const [u, sec] of units) { const n = Math.floor(s / sec); if (n >= 1) return `${n} ${u}${n > 1 ? "s" : ""} ago`; }
  return "today";
}
const laterBtn = (vid) => {
  const on = watchLater.includes(vid);
  return `<span class="later-btn ${on ? "on" : ""}" role="button" tabindex="0" data-later="${vid}"
    title="${on ? "Remove from Watch later" : "Watch later"}" aria-label="${on ? "Remove from Watch later" : "Watch later"}">${on ? CHECK : CLOCK}</span>`;
};
// "Video frames" setting (on by default): show a frame from the middle of the video instead of the
// uploader's attention-optimized thumbnail. By default the frame comes straight from YouTube (hq2.jpg);
// a server started with --frames local serves its downloaded copies instead. Either way a missing
// frame falls back to the regular thumbnail.
let useFrames = store.get("frames", true);
let framesSource = "youtube";
const frameSrc = (vid) => framesSource === "local" ? `/frames/${vid}.jpg` : `https://i.ytimg.com/vi/${vid}/hq2.jpg`;
const thumbSrc = (vid) => useFrames ? frameSrc(vid) : `https://i.ytimg.com/vi/${vid}/hqdefault.jpg`;
function thumbFallback(img) {
  const vid = img.dataset.vid;
  if (img.src.includes("/frames/")) img.src = `https://i.ytimg.com/vi/${vid}/hq2.jpg`;
  else if (img.src.includes("/hq2.jpg")) img.src = `https://i.ytimg.com/vi/${vid}/hqdefault.jpg`;
  else img.onerror = null;
}
const thumb = (d) => `<div class="thumb"><img loading="lazy" src="${thumbSrc(d.vid)}" data-vid="${d.vid}" onerror="thumbFallback(this)" alt="">${laterBtn(d.vid)}<span class="dur">${dur(d.duration_s)}</span></div>`;
const sub = (d) => [views(d.views), ago(d.published), `${d.hn?.mentions || 1} LW link${d.hn?.mentions === 1 ? "" : "s"}`].filter(Boolean).join(" • ");

// ---------- components ----------
const card = (d) => `<a class="vcard" href="/watch/${d.vid}"${d.reason ? ` title="${esc(d.reason)}"` : ""}>${thumb(d)}
  <div class="info"><div style="min-width:0">
    <h3 class="vt">${esc(d.title)}</h3><div class="sub">${esc(d.channel)}</div>
    <div class="sub">${sub(d)}</div></div></div></a>`;

const row = (d) => `<a class="srow" href="/watch/${d.vid}">${thumb(d)}<div style="min-width:0">
    <h3 class="vt">${esc(d.title)}</h3><div class="sub">${sub(d)}</div>
    <div class="chan">${esc(d.channel)}</div>
    <div class="snip">${esc(d.summary)}</div>
    ${d.via ? `<span class="via">Topic match · ${esc(d.via)}</span>` : ""}</div></a>`;

const next = (d) => `<a class="next" href="/watch/${d.vid}">${thumb(d)}<div style="min-width:0">
    <h3 class="vt">${esc(d.title)}</h3><div class="sub">${esc(d.channel)}</div><div class="sub">${sub(d)}</div></div></a>`;

// comment text: escape, then turn the link markers into small pills
const commentHTML = (t) => esc(t).replace(/\[VIDEO\]/g, '<span class="mk v">▶ this video</span>').replace(/\[LINK\]/g, '<span class="mk">link</span>');
const STANCE = { strong_rec: "Likely strong recommendation", rec: "Likely recommendation", reference: "Citation / unclear", joke: "Possibly humorous", critical: "Possibly critical" };

async function api(path) { const r = await fetch(path); if (!r.ok) throw new Error(r.status); return r.json(); }

// ---------- infinite scroll ----------
let pager = null;
function infinite(container, load) {
  if (pager) pager.disconnect();
  let offset = 0, busy = false, done = false;
  const sentinel = document.createElement("div"); sentinel.className = "sentinel";
  container.after(sentinel);
  const more = async () => {
    if (busy || done) return; busy = true;
    let items;
    try { items = await load(offset); } catch { busy = false; done = true; if(container.isConnected) container.innerHTML = `<div class="status">Could not load videos. <a href="${esc(location.pathname)}">Try again</a></div>`; return; }
    if (!container.isConnected) return;
    offset += items.length; done = items.length === 0;
    container.insertAdjacentHTML("beforeend", items.map(card).join(""));
    if (!offset) container.outerHTML = `<div class="status">${filtering(filterParams()) ? "No videos match these filters." : "Nothing here yet."}</div>`;
    busy = false;
    if (!done && sentinel.getBoundingClientRect().top < innerHeight + 800) more();
  };
  pager = new IntersectionObserver((e) => e[0].isIntersecting && more(), { rootMargin: "800px" });
  pager.observe(sentinel);
  more();
}

// ---------- pages ----------
async function home() {
  const params = filterParams();
  const stats = await api("/api/stats");
  view.innerHTML = `<div class="pagehead"><h2>Videos from LessWrong</h2><p class="sub">${Number(stats.videos).toLocaleString()} videos from public posts and comments. Repeated links rank higher. <a href="/browse">Browse all videos →</a></p></div>${filterBar("/browse", params, true, false)}<div class="grid" id="grid"></div>`;
  wireFilterBar();
  infinite($("#grid"), (offset) =>
    api(`/api/feed?like=${likes.join(",")}&dislike=${dislikes.join(",")}&seen=${seen.join(",")}&seed=${seed}&offset=${offset}&n=36`));
}

// one topic category, best first, with its area as a breadcrumb
async function category(id) {
  areasCache ??= await api("/api/browse");
  const a = areasCache.find(x => x.categories.some(c => c.id === id));
  if (!a) return notFound();
  const c = a.categories.find(c => c.id === id);
  document.title = `${c.name} - LessTube`;
  const params = filterParams();
  view.innerHTML = `<div class="pagehead"><a class="crumb" href="/a/${a.id}">${esc(a.name)}</a><h2>${esc(c.name)}</h2></div>
    ${filterBar(`/c/${id}`, params, true)}<div class="grid" id="grid"></div>`;
  wireFilterBar();
  infinite($("#grid"), (offset) => api(withParams("/api/list", { cat: id, ...params, offset, n: 36 })));
}

// every video, filtered and sorted: the home page's Filters lead here (advanced search without a query)
async function browsePage() {
  document.title = (filterParams().dur === "xlong" ? "Longs" : "Browse all videos") + " - LessTube";
  const params = filterParams();
  const longs = params.dur === "xlong";
  view.innerHTML = `<div class="pagehead"><h2>${longs ? "Longs" : "All videos"}</h2>${longs
      ? `<p class="sub">Every video over an hour. The opposite of Shorts.</p>` : ""}</div>${filterBar("/browse", params, true)}
    <div class="grid" id="grid"></div>`;
  wireFilterBar();
  infinite($("#grid"), (offset) => api(withParams("/api/list", { ...params, offset, n: 36 })));
}

let areasCache = null;
async function area(id) {
  areasCache ??= await api("/api/browse");
  const a = areasCache.find(x => x.id === id);
  if (!a) return notFound();
  const params = filterParams();
  view.innerHTML = `<div class="pagehead"><h2>${esc(a.name)}</h2></div>
    <div class="catwrap">${a.categories.map(c => `<a class="chip" href="/c/${c.id}">${esc(c.name)}</a>`).join("")}</div>
    ${filterBar(`/a/${id}`, params, true)}<div class="grid" id="grid"></div>`;
  wireFilterBar();
  infinite($("#grid"), (offset) => api(withParams("/api/list", { area: id, ...params, offset, n: 36 })));
}

const playlistCard = (p) => `<a class="plcard" href="/p/${p.slug}">
    <div class="mosaic">${p.cover.map(v => `<img loading="lazy" src="${thumbSrc(v)}" data-vid="${v}" onerror="thumbFallback(this)" alt="">`).join("")}
      <span class="plcount">${p.count} videos · ${hours(p.minutes)}</span></div>
    <h3 class="vt">${esc(p.title)}</h3><p class="sub">${esc(p.pitch)}</p></a>`;

const hours = (m) => m >= 60 ? `${Math.floor(m / 60)} hr ${m % 60} min` : `${m} min`;

// one playlist: Claude's intro, then the videos in order with a note on each, and Play all on YouTube
async function playlistPage(slug) {
  let pl;
  try { pl = await api(`/api/playlist?slug=${encodeURIComponent(slug)}`); } catch { return notFound(); }
  document.title = `${pl.title} - LessTube`;
  view.innerHTML = `<div class="plpage">
    <div class="plhead">
      <div class="mosaic">${pl.videos.slice(0, 4).map(d => `<img src="${thumbSrc(d.vid)}" data-vid="${d.vid}" onerror="thumbFallback(this)" alt="">`).join("")}</div>
      <div class="plinfo">
        <a class="crumb" href="/playlists">Playlists</a>
        <h2>${esc(pl.title)}</h2>
        <div class="sub">From LessWrong discussions · ${pl.videos.length} videos · ${hours(pl.minutes)}</div>
        <p class="intro">${esc(pl.intro)}</p>
        <div class="filterbar">${playAll()}</div>
      </div>
    </div>
    <ol class="plrows">${pl.videos.map((d, i) => `<li><span class="num">${i + 1}</span>
      <a class="srow" href="/watch/${d.vid}">${thumb(d)}<div style="min-width:0">
        <h3 class="vt">${esc(d.title)}</h3><div class="sub">${esc(d.channel)} · ${sub(d)}</div>
        <p class="plnote">${esc(d.note)}</p></div></a></li>`).join("")}</ol>
  </div>`;
  wirePlayAll();
}

// every topic area with its categories, plus quick ways into the whole collection
async function categoriesPage() {
  document.title = "Categories - LessTube";
  areasCache ??= await api("/api/browse");
  view.innerHTML = `<div class="explore">
    <div class="pagehead"><h2>Categories</h2></div>
    <div class="quick">
      <a class="pill" href="/browse?sort=recent">Recently recommended</a>
      <a class="pill" href="/browse?dur=xlong">Longs</a>
      <a class="pill" href="/browse?gems=1">Hidden gems</a>
      <a class="pill" href="/browse">All videos</a>
    </div>
    <div class="areas">${areasCache.map(a => `<section class="areacard">
      <a class="areaname" href="/a/${a.id}">${esc(a.name)}<span class="count">${a.count}</span></a>
      <div class="cats">${a.categories.map(c => `<a href="/c/${c.id}">${esc(c.name)}<span class="count">${c.count}</span></a>`).join("")}</div>
    </section>`).join("")}</div>
  </div>`;
}

// the playlists drawn from LessWrong
async function playlistsPage() {
  document.title = "Playlists - LessTube";
  const pls = await api("/api/playlists").catch(() => []);
  view.innerHTML = `<div class="explore">
    <div class="pagehead"><h2>Playlists</h2>
      <p class="sub">From LessWrong posts and comments, with repeatedly linked videos first.</p></div>
    ${!pls.length ? `<p class="sub">Coming soon.</p>` : [["start", "Start here", "Broad, essential lists for your first visit."],
        ["deep", "Deep dives", "One obsession each, for when you want to go down a rabbit hole."]]
      .map(([tier, title, blurb]) => { const ps = pls.filter(p => (p.tier || "deep") === tier);
        return ps.length ? `<h3 class="sechead">${title}</h3><p class="sub">${blurb}</p>
          <div class="pgrid">${ps.map(playlistCard).join("")}</div>` : ""; }).join("")}
  </div>`;
}

async function about() {
  document.title = "About - LessTube";
  const s = await api("/api/stats");
  const fmt = n => Number(n).toLocaleString("en-US");
  view.innerHTML = `<article class="about">
    <h1>Less<span style="color:var(--accent)">Tube</span></h1>
    <p class="lede">The YouTube videos that LessWrong keeps telling each other to watch.</p>
    <div class="stats"><div class="stat"><b>${fmt(s.videos)}</b><span>videos</span></div><div class="stat"><b>${fmt(s.scanned)}</b><span>public posts &amp; comments scanned</span></div><div class="stat"><b>${fmt(s.categories)}</b><span>topics in ${s.areas} areas</span></div><div class="stat"><b>${s.first_year}–${s.last_year}</b><span>years of LessWrong</span></div></div>
    <h2>Why</h2><p>A good recommendation can outlast the discussion it was posted in. LessWrong has years of conversations about rationality, artificial intelligence, science, philosophy, and how to think clearly. The videos people return to are scattered across those conversations.</p><p>LessTube collects those links in one place, with source excerpts and links back to LessWrong. It follows <a href="https://hackertube.org/about" target="_blank" rel="noopener">HackerTube</a>’s idea and interface, adapted to a different community.</p>
    <h2>How it was built</h2><ol class="steps"><li><b>Scan public posts and comments.</b> The resumable importer reads LessWrong’s public GraphQL API. This snapshot scanned ${fmt(s.scanned_posts)} posts and ${fmt(s.scanned_comments)} comments, finding ${fmt(s.mentions)} video links.</li><li><b>Include every discovered video.</b> One link is enough. There is no minimum author count, number of months, or comment length. Multiple links to the same video within one post or comment count once. Videos remain listed when YouTube metadata cannot be retrieved; their source links and video IDs stay available.</li><li><b>Rank repeated linking higher.</b> The score is 3 × distinct calendar months + 2 × distinct authors + log(1 + source mentions), combining posts and comments. This rewards independent, sustained interest without hiding one-off discoveries. Author IDs are used when available.</li><li><b>Keep context visible.</b> Video pages distinguish post-body references from comments and link to the originals. Labels and topic assignments are keyword estimates, not human judgments. Summaries are source extracts. A link may be a recommendation, citation, joke, or criticism.</li></ol>
    <p class="fine">Coverage is limited to public records returned by the API. The index is a snapshot, not a guarantee of every historical link. Unknown durations and upload dates are omitted from filters that require them.</p>
    <h2>What you can do</h2><ul><li><b>Home</b> includes all indexed videos, with repeated links ranked higher. Hover a video to see its linking history.</li><li><b>Search</b> matches titles, channels, post and comment context, and related topic vocabulary, then refines results with BGE-small semantic embeddings. The search model downloads on first use and runs in your browser.</li><li><b>Browse</b> by category, duration, type, upload date, and more. Playlists give you a starting point.</li><li><b>Every video page</b> shows excerpts from the source posts and comments, with links to the originals.</li><li><b>Like, Watch later, and History</b> stay in your browser; likes steer your feed.</li><li><b>Keyboard shortcuts:</b> press <kbd>?</kbd> for the list; <kbd>/</kbd> searches and <kbd>j</kbd>/<kbd>k</kbd> moves between videos.</li></ul>
    <h2>Fork it</h2><p><a href="/data">Download the data →</a> The export includes video IDs, source-attributed post and comment excerpts, topic assignments, and the import methodology. Original posts and comments remain the work of their authors, under their original terms. LessTube does not relicense them.</p>
    <h2>Privacy</h2><p>No accounts or analytics. Likes, dislikes, history, and Watch later are stored only in this browser. Videos use YouTube’s privacy-enhanced embed, loaded when you press play. Images and video playback make requests to YouTube. Semantic search downloads an open model from Hugging Face using Transformers.js from jsDelivr; your query is encoded locally.</p>
    <h2>Source code</h2><p><a href="https://github.com/eula01/lesstube" target="_blank" rel="noopener noreferrer">View the LessTube repository on GitHub →</a></p>

// filters, YouTube-style, on search and topic pages. Each option is one URL parameter, so filtered pages are
// shareable links. Hidden gems: recommended on LW but under 100k YouTube views. Evergreen: drops news-only videos.
const FILTERS = [
  ["Linked in", [["source", "post", "Post bodies"], ["source", "comment", "Comments"]]],
  ["Upload date", [["date", "year", "Past year"], ["date", "2020s", "2020s"], ["date", "2010s", "2010s"],
                   ["date", "2000s", "2000s"]]],
  ["Type", [["type", "talk", "Talk"], ["type", "lecture", "Lecture"], ["type", "explainer", "Explainer"],
            ["type", "tutorial", "Tutorial"], ["type", "documentary", "Documentary"], ["type", "interview", "Interview"],
            ["type", "demo", "Demo"], ["type", "commentary", "Commentary"], ["type", "comedy", "Comedy"],
            ["type", "music", "Music"]]],
  ["Duration", [["dur", "short", "Under 4 minutes"], ["dur", "medium", "4–20 minutes"], ["dur", "long", "20–60 minutes"],
                ["dur", "xlong", "Over 1 hour"]]],
  ["Features", [["gems", "1", "Hidden gems"], ["evergreen", "1", "Evergreen only"]]],
  ["Sort by", [["sort", "", "Relevance"], ["sort", "recent", "Recently recommended"], ["sort", "date", "Upload date"],
               ["sort", "old", "Oldest first"], ["sort", "views", "View count"], 
               ["sort", "hn", "Most linked"]]],
];
const FILTER_KEYS = [...new Set(FILTERS.flatMap(([, opts]) => opts.map(([k]) => k)))];
let filtersOpen = false;

const filterParams = () => {
  const url = new URLSearchParams(location.search);
  return Object.fromEntries(FILTER_KEYS.map((k) => [k, url.get(k) || ""]));
};
const withParams = (path, params) => {
  const qs = new URLSearchParams(Object.entries(params).filter(([, v]) => v)).toString();
  return path + (qs ? `?${qs}` : "");
};
const filtering = (params) => FILTER_KEYS.some((k) => k !== "sort" && params[k]);

// the Filters button, chips for the active filters, and the (collapsed) panel. On topic pages there is no
// query, so the default order is "Best first" (most recommended) and that option is folded into it.
function filterBar(path, params, listing = false, playable = true) {
  // clicking an option sets it (clicking the active one clears it); the first sort option clears the sort
  const link = (k, v) => withParams(path, { ...params, [k]: params[k] === v ? "" : v });
  const groups = FILTERS.map(([title, opts]) => [title, !listing || title !== "Sort by" ? opts
    : opts.filter(([, v]) => v !== "hn").map(([k, v, label]) => [k, v, v ? label : "Best first"])]);
  const active = groups.flatMap(([, opts]) => opts.filter(([k, v]) => v && params[k] === v)
    .map(([k, v, label]) => `<a class="chip on" href="${link(k, v)}" title="Remove filter">${label}<span>×</span></a>`));
  return `<div class="filterbar">
      <button class="pill${filtersOpen ? " on" : ""}" id="filters-btn" aria-expanded="${filtersOpen}">
        <svg viewBox="0 0 24 24"><path d="M15 17h6v1h-6v-1zm-4 0H3v1h8v2h1v-5h-1v2zm3-9h1V3h-1v2H3v1h11v2zm4-3v1h3V5h-3zM6 14h1V9H6v2H3v1h3v2zm4-2h11v-1H10v1z"/></svg>
        Filters</button>${active.join("")}<span class="grow"></span>${playable ? playAll() : ""}</div>
    <div class="filters"${filtersOpen ? "" : " hidden"}>${groups.map(([title, opts]) => `<div><h4>${title}</h4>
      ${opts.map(([k, v, label]) => `<a href="${link(k, v)}" class="${(params[k] || "") === v ? "on" : ""}">${label}</a>`).join("")}
    </div>`).join("")}</div>`;
}

let semanticWorker, semanticId=0;
const semanticPending=new Map();
function embedQuery(q){
 if(!semanticWorker){
  semanticWorker=new Worker('/semantic-worker.js',{type:'module'});
  semanticWorker.onmessage=({data})=>{const task=semanticPending.get(data.id);if(task){clearTimeout(task.timer);semanticPending.delete(data.id);data.vector?task.resolve(data.vector):task.reject(new Error(data.error));}};
  semanticWorker.onerror=(event)=>{for(const task of semanticPending.values()){clearTimeout(task.timer);task.reject(new Error(event.message||'Model unavailable'));}semanticPending.clear();semanticWorker.terminate();semanticWorker=null;};
 }
 return new Promise((resolve,reject)=>{const id=++semanticId;const timer=setTimeout(()=>{semanticPending.delete(id);reject(new Error('Model timeout'));},90000);semanticPending.set(id,{resolve,reject,timer});semanticWorker.postMessage({id,q});});
}

async function search(q) {
  $("#q").value = q;

  view.innerHTML = `<div class="status">Searching…</div>`;
  let res;
  try { res = await api(withParams("/api/search", { q, ...params })); }
  catch (e) {
    if (e.message !== "429" && e.message !== "503") throw e;
    view.innerHTML = `<div class="status">Lots of searches right now. Give it a minute and try again.</div>`;
    return;
  }
  view.innerHTML = filterBar(`/search/${encodeURIComponent(q)}`, params)
    + (res.weak && !res.results.length ? `<div class="note">No videos match “${esc(q)}” with these filters.</div>`
       : res.weak ? `<div class="note">No strong matches for “${esc(q)}”. Here are the closest videos.</div>` : "")
    + `<p class="sub" id="search-mode">Matching words and topics · refining by meaning…</p><div class="results">${res.results.map(row).join("")}</div>`;
  wireFilterBar();
  const searchPath=location.pathname+location.search;
  embedQuery(q).then(async vector=>{
   const result=await api(withParams('/api/search',{q,...params,vector:JSON.stringify(vector)}));
   if(location.pathname+location.search!==searchPath)return;
   const list=$('.results'); if(list)list.innerHTML=result.results.map(row).join('');
   const status=$('#search-mode');if(status)status.textContent='Semantic search · BGE-small · query encoded in your browser';
  }).catch(error=>{if(location.pathname+location.search===searchPath){const status=$('#search-mode');if(status){status.textContent='Matching words and topics · semantic model unavailable';status.dataset.error=error.message;}}});
}

function vote(vid, list, other, me, them) {
  const i = list.indexOf(vid);
  if (i >= 0) list.splice(i, 1); else { list.push(vid); const j = other.indexOf(vid); if (j >= 0) other.splice(j, 1); }
  store.set("likes", likes); store.set("dislikes", dislikes);
  $(me).classList.toggle("on", list.includes(vid)); $(them).classList.remove("on");
}

// ---------- router ----------
// Real paths (/watch/<id>, /search/<q>, ...) so links are shareable and get link previews; the server
// returns this page for every such path. In-app navigation uses pushState, so it stays instant.
function navigate(path) {
  if (path !== location.pathname + location.search) history.pushState(null, "", path);
  route();
}

async function route() {
  // links from before path routing looked like /#/watch/<id>: move them to the real path
  if (location.hash.startsWith("#/")) {
    history.replaceState(null, "", location.hash.slice(1));
  }
  const path = location.pathname;
  const [, page, ...rest] = path.split("/");
  let arg; try { arg = decodeURIComponent(rest.join("/")); } catch { return notFound(); }
  document.title = "LessTube";
  document.body.classList.remove("drawer");
  selected = -1;
  for (const a of document.querySelectorAll(".side a")) {
    a.classList.toggle("on", a.getAttribute("href") === path + location.search);
  }
  if (page !== "search") $("#q").value = "";
  if (pager) { pager.disconnect(); pager = null; }
  try {
    if (!page) await home();
    else if (page === "c") await category(arg);
    else if (page === "categories") await categoriesPage();
    else if (page === "playlists") await playlistsPage();
    else if (page === "p") await playlistPage(arg);
    else if (page === "a") await area(arg);
    else if (page === "browse") await browsePage();
    else if (page === "watch") await watch(arg);
    else if (page === "search") await search(arg);
    else if (page === "liked") await liked();
    else if (page === "history") await historyPage();
    else if (page === "later") await later();
    else if (page === "about") await about();
    else if (page === "settings") settings();
    else if (page === "data") await dataPage();
    else notFound();
  } catch (e) { view.innerHTML = `<div class="status">Something went wrong (${esc(e.message)}).</div>`; }
  window.scrollTo(0, 0);
}

  const on = toggleLater(vid);
  document.querySelectorAll(`[data-later="${vid}"]`).forEach(b => { b.outerHTML = laterBtn(vid); });
  if (location.pathname === `/watch/${vid}` && $("#save-later")) $("#save-later").innerHTML = on ? CHECK + "Saved" : CLOCK + "Watch later";
  toast(on ? "Saved to Watch later" : "Removed from Watch later");
}
const SHORTCUTS = [["/", "Search"], ["j / k", "Next / previous video"], ["Enter", "Open the selected video"],
  ["l", "Like the selected or current video"], ["w", "Watch later for the selected or current video"],
  ["p", "Play (on a video page)"], ["h", "Home"], ["?", "Show these shortcuts"], ["Esc", "Close / leave the search box"]];
function toggleHelp(force) {
  const h = $("#help");
  const show = force ?? !h.classList.contains("on");
  h.innerHTML = `<div class="help-card" role="dialog" aria-label="Keyboard shortcuts"><h3>Keyboard shortcuts</h3>
    <table>${SHORTCUTS.map(([k, d]) => `<tr><td>${k.split(" / ").map(x => `<kbd>${esc(x)}</kbd>`).join(" / ")}</td><td>${esc(d)}</td></tr>`).join("")}</table></div>`;
  h.classList.toggle("on", show);
}
$("#help").onclick = (e) => { if (e.target.id === "help") toggleHelp(false); };
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const el = document.activeElement;
  const typing = el && (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable);
  if (e.key === "Escape") {
    if (typing) el.blur();
    toggleHelp(false); document.body.classList.remove("drawer");
    return;
  }
  if (typing) return;
  const sel = listItems()[selected];
  const watching = location.pathname.startsWith("/watch/") ? location.pathname.split("/")[2] : null;
  const target = vidOf(sel) || watching;
  const key = e.code === "Slash" && e.shiftKey ? "?" : e.key;   // "?" by position too, for odd layouts
  switch (key) {
    case "/": e.preventDefault(); $("#q").focus(); $("#q").select(); break;
    case "j": select(selected + 1); break;
    case "k": select(selected - 1); break;
    case "Enter": if (sel) { e.preventDefault(); navigate(sel.getAttribute("href")); } break;
    case "l": if (target) keyLike(target); break;
    case "w": if (target) keyLater(target); break;
    case "p": $("#poster")?.click(); break;
    case "h": navigate("/"); break;
    case "?": toggleHelp(); break;
    default: return;
  }
});

api("/api/config").then((c) => { framesSource = c.frames_source || "youtube"; }).catch(() => {}).finally(route);
</script>
